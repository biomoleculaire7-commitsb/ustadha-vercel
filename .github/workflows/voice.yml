
name: voice
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "samples = عينات للاستماع ، all = توليد كل الدروس"
        type: choice
        options: [samples, all]
        default: samples
      voice:
        description: "ar-DZ-AminaNeural"
        type: choice
        options: [ar-SA-ZariyahNeural, ar-EG-SalmaNeural, ar-AE-FatimaNeural, ar-DZ-AminaNeural, ar-MA-MounaNeural, ar-JO-SanaNeural, ar-LB-LaylaNeural, ar-QA-AmalNeural, ar-SY-AmanyNeural]
        default: ar-EG-SalmaNeural
      rate:
        description: "السرعة (-10% أبطأ)"
        default: "-10%"
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - if: inputs.mode == 'samples'
        run: python scripts/edge_voice.py --sample
      - if: inputs.mode == 'all'
        run: python scripts/edge_voice.py --voice "${{ inputs.voice }}" --rate "${{ inputs.rate }}"
      - run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add -f public/audio public/samples || true
          git commit -m "voice" || echo "nothing"
          git push
